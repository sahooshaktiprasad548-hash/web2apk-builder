name: Build Android APK

# The Worker matches the run to a build by this title (exposed by GitHub as display_title).
run-name: Web2APK Build ${{ inputs.build_id }}

on:
  workflow_dispatch:
    inputs:
      build_id:
        description: 'Unique Web2APK build ID'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: web2apk-${{ inputs.build_id }}
  cancel-in-progress: false

jobs:
  build:
    name: Compile Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      BUILD_ID: ${{ inputs.build_id }}

    steps:
      - name: Validate build ID
        shell: bash
        run: |
          set -euo pipefail
          if ! [[ "$BUILD_ID" =~ ^[a-z0-9][a-z0-9-]{7,63}$ ]]; then
            echo "::error::Invalid build_id format"
            exit 1
          fi

      # The Worker committed the generated Android project to this ephemeral branch
      # BEFORE dispatching the workflow, so the runner always receives real project files.
      - name: Checkout uploaded project branch
        uses: actions/checkout@v4
        with:
          ref: web2apk/build-${{ inputs.build_id }}
          path: input

      - name: Validate and extract Android project
        shell: bash
        run: |
          set -euo pipefail
          META="input/.web2apk-build/build.json"
          ZIP_FILE="input/.web2apk-build/project.zip"
          for f in "$META" "$ZIP_FILE"; do
            if [ ! -s "$f" ]; then
              echo "::error::Missing $f - the project upload did not reach the build branch"
              exit 1
            fi
          done

          BUILD_TYPE=$(jq -r '.build_type' "$META")
          PACKAGE_NAME=$(jq -r '.package_name' "$META")
          APP_VERSION=$(jq -r '.app_version' "$META")
          [[ "$BUILD_TYPE" =~ ^(debug|release)$ ]] || { echo "::error::Invalid build_type"; exit 1; }
          [[ "$PACKAGE_NAME" =~ ^[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)+$ ]] || { echo "::error::Invalid package_name"; exit 1; }
          [[ "$APP_VERSION" =~ ^[0-9A-Za-z.+_-]{1,40}$ ]] || { echo "::error::Invalid app_version"; exit 1; }
          {
            echo "BUILD_TYPE=$BUILD_TYPE"
            echo "PACKAGE_NAME=$PACKAGE_NAME"
            echo "APP_VERSION=$APP_VERSION"
          } >> "$GITHUB_ENV"

          # Zip-slip guard before extraction
          unzip -Z1 "$ZIP_FILE" > entries.txt
          if grep -qE '(^/|(^|/)\.\.(/|$)|\\)' entries.txt; then
            echo "::error::Unsafe path traversal detected in project archive"
            exit 1
          fi

          mkdir -p android_project
          unzip -q "$ZIP_FILE" -d android_project
          for req in settings.gradle build.gradle app/build.gradle app/src/main/AndroidManifest.xml; do
            if [ ! -f "android_project/$req" ]; then
              echo "::error::Invalid Android project: missing $req"
              exit 1
            fi
          done
          echo "Android project validated: $PACKAGE_NAME v$APP_VERSION ($BUILD_TYPE)"

      - name: Install JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: >-
            platform-tools
            platforms;android-34
            platforms;android-35
            build-tools;34.0.0

      - name: Install Gradle 8.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.6'

      - name: Prepare release keystore
        if: ${{ env.BUILD_TYPE == 'release' }}
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Release keystore configured."
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 secret not set - the release APK will be unsigned and the verification step will fail. Use a debug build or add the keystore secrets."
          fi

      # NOTE: keep this step name in sync with BUILD_STEP_NAME in worker/src/index.js
      - name: Build Android APK with Gradle
        working-directory: android_project
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ "$BUILD_TYPE" = "release" ]; then
            gradle assembleRelease --no-daemon --stacktrace --console=plain
          else
            gradle assembleDebug --no-daemon --stacktrace --console=plain
          fi

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK=$(find android_project/app/build/outputs/apk -type f -name '*.apk' -print -quit)
          if [ -z "$APK" ] || [ ! -s "$APK" ]; then
            echo "::error::Gradle finished but produced no non-empty .apk file"
            exit 1
          fi
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)

          unzip -tq "$APK"
          "$BT/aapt2" dump badging "$APK" > badging.txt
          grep -q "package: name='$PACKAGE_NAME'" badging.txt || {
            echo "::error::APK package id does not match expected $PACKAGE_NAME"
            head -n 3 badging.txt
            exit 1
          }
          "$BT/apksigner" verify --verbose "$APK" || {
            echo "::error::APK signature verification failed (unsigned release builds cannot be installed)"
            exit 1
          }

          mkdir -p apk_output
          OUT="apk_output/${PACKAGE_NAME}-v${APP_VERSION}-${BUILD_TYPE}.apk"
          cp "$APK" "$OUT"
          ls -lh "$OUT"
          echo "APK verified: valid ZIP, package $PACKAGE_NAME, signature OK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: web2apk-${{ inputs.build_id }}-apk
          path: apk_output/*.apk
          retention-days: 7
          if-no-files-found: error
